<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get a Quote | HEPTRA</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="hero">
    <h1>Request a Free Quote</h1>
    <form action="#" method="post" style="max-width: 400px; margin: auto; background: white; padding: 2rem; border-radius: 8px;">
      <label>Name:</label><br>
      <input type="text" name="name" required style="width: 100%; margin-bottom: 1rem;"><br>
      <label>Email:</label><br>
      <input type="email" name="email" required style="width: 100%; margin-bottom: 1rem;"><br>
      <label>Service Needed:</label><br>
      <textarea name="message" required style="width: 100%; height: 100px;"></textarea><br>
      <button type="submit" class="btn-primary" style="width: 100%;">Submit</button>
    </form>
  </main>
</body>
</html>
